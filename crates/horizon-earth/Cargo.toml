[package]
name = "horizon-earth"
version = "0.1.0"
edition.workspace = true
# Ported from Earth Platform (github.com/pirut/earth-platform), which is LGPL-3.0-only.
license = "LGPL-3.0-only"
rust-version.workspace = true
description = "The real Earth as a Horizon world: elevation, land cover and climate streamed from open data (docs/earth.md)"

[dependencies]
# Terrain tiles and range reads of the land cover and climate GeoTIFFs. native-certs as well as the
# bundled roots, so the data loads behind proxies that re-sign TLS.
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
png = "0.18"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
log = "0.4"

[lints]
workspace = true
